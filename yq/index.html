                    "用 AI 把知识变成游戏化任务"
                ],
                closingWords: "你不是不自律，你只是更适合通过行动学习。很多发明家、工程师、创业者，小时候都喜欢拆东西、动手做、边试边学。实践力本身就是一种天赋。"
            },
            D: {
                name: "逻辑破译者",
                professionalName: "逻辑探索型学习者",
                color: "#9b59b6", // 紫色
                icon: "fa-puzzle-piece",
                summary: "你更适合先理解原因、规律和方法。只要真正想明白，你就会学得很扎实。",
                superpower: "你特别擅长发现规律、分析问题、独立思考。你经常会问「为什么」，想知道原理，也喜欢研究复杂问题。你的大脑像一台「规律发现机器」。",
                challenges: "如果学习总是只背答案、不讲原因、机械重复，你可能会越来越抗拒，甚至觉得「学这个有什么意义」。不是你叛逆，而是你的大脑更需要理解。",
                methods: [
                    "先理解原理",
                    "自己研究问题",
                    "找规律和方法",
                    "拆解复杂知识",
                    "深度思考后再记忆"
                ],
                notGoodAt: [
                    "死记硬背",
                    "不解释原因的学习",
                    "重复机械练习",
                    "没有思考空间的学习"
                ],
                aiHelp: [
                    "和 AI 深度问答",
                    "让 AI 帮你做逻辑分析",
                    "用 AI 学编程和 Prompt",
                    "让 AI 拆解复杂问题",
                    "让 AI 帮你总结方法和规律"
                ],
                closingWords: "你不是想太多，你只是更喜欢真正理解世界。很多科学家、程序员、研究者，小时候都特别爱问「为什么」。会思考，是一种非常珍贵的能力。"
            }
        };

        // 应用状态
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let startTime = null;
        let timerInterval = null;

        // DOM 元素
        const welcomeScreen = document.getElementById('welcome-screen');
        const testScreen = document.getElementById('test-screen');
        const resultScreen = document.getElementById('result-screen');
        const startTestBtn = document.getElementById('start-test');
        const restartTestBtn = document.getElementById('restart-test');
        const shareResultBtn = document.getElementById('share-result');
        const closeShareBtn = document.getElementById('close-share');
        const copyResultBtn = document.getElementById('copy-result');
        const shareModal = document.getElementById('share-modal');
        const progressBar = document.getElementById('progress-bar');
        const currentQuestionSpan = document.getElementById('current-question');
        const timerSpan = document.getElementById('timer');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackContainer = document.getElementById('feedback-container');
        const resultContent = document.getElementById('result-content');
        const shareContent = document.getElementById('share-content');

        // 开始测试
        startTestBtn.addEventListener('click', () => {
            welcomeScreen.classList.add('hidden');
            testScreen.classList.remove('hidden');
            currentQuestionIndex = 0;
            userAnswers = {};
            startTime = new Date();
            
            // 开始计时器
            startTimer();
            
            // 显示第一题
            showQuestion(currentQuestionIndex);
        });

        // 重新测试
        restartTestBtn.addEventListener('click', () => {
            resultScreen.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
            clearInterval(timerInterval);
        });

        // 分享结果
        shareResultBtn.addEventListener('click', () => {
            shareModal.classList.remove('hidden');
            generateShareContent();
        });

        // 关闭分享弹窗
        closeShareBtn.addEventListener('click', () => {
            shareModal.classList.add('hidden');
        });

        // 复制结果
        copyResultBtn.addEventListener('click', () => {
            const textToCopy = shareContent.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('结果已复制到剪贴板！');
            }).catch(err => {
                console.error('复制失败:', err);
            });
        });

        // 开始计时器
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsedTime = Math.floor((new Date() - startTime) / 1000);
                const minutes = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
                const seconds = (elapsedTime % 60).toString().padStart(2, '0');
                timerSpan.textContent = `${minutes}:${seconds}`;
            }, 1000);
        }

        // 显示问题
        function showQuestion(index) {
            const question = questions[index];
            currentQuestionSpan.textContent = question.id;
            questionText.textContent = question.text;
            
            // 更新进度条
            const progress = ((index + 1) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;
            
            // 清空选项容器
            optionsContainer.innerHTML = '';
            
            // 添加选项
            question.options.forEach(option => {
                const optionButton = document.createElement('button');
                optionButton.className = `w-full text-left p-4 border-2 rounded-xl mb-3 btn-hover transition-all ${userAnswers[question.id] === option.id ? 'border-primary bg-primary/5 text-primary' : 'border-gray-200 hover:border-primary hover:bg-primary/5'}`;
                optionButton.innerHTML = `
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full border-2 flex items-center justify-center mr-3 ${userAnswers[question.id] === option.id ? 'border-primary bg-primary text-white' : 'border-gray-300'}">
                            ${option.id}
                        </div>
                        <span class="text-lg">${option.text}</span>
                    </div>
                `;
                
                optionButton.addEventListener('click', () => {
                    selectOption(question.id, option.id);
                });
                
                optionsContainer.appendChild(optionButton);
            });
            
            // 隐藏反馈
            feedbackContainer.classList.add('hidden');
        }

        // 选择选项
        function selectOption(questionId, optionId) {
            userAnswers[questionId] = optionId;
            
            // 显示反馈
            showFeedback(optionId);
            
            // 延迟后进入下一题
            setTimeout(() => {
                if (currentQuestionIndex < questions.length - 1) {
                    currentQuestionIndex++;
                    showQuestion(currentQuestionIndex);
                } else {
                    // 测试完成
                    finishTest();
                }
            }, 1000);
        }

        // 显示反馈
        function showFeedback(optionId) {
            feedbackContainer.innerHTML = `
                <div class="bg-green-50 border border-green-200 text-green-700 p-4 rounded-lg">
                    <div class="flex items-center">
                        <i class="fa fa-check-circle text-green-500 text-xl mr-2"></i>
                        <span>已选择 ${optionId}，继续下一题...</span>
                    </div>
                </div>
            `;
            feedbackContainer.classList.remove('hidden');
        }

        // 完成测试
        function finishTest() {
            clearInterval(timerInterval);
            testScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            // 生成结果
            generateResult();
        }

        // 生成结果
        function generateResult() {
            // 统计分数
            const scores = { A: 0, B: 0, C: 0, D: 0 };
            for (const answer of Object.values(userAnswers)) {
                scores[answer]++;
            }
            
            // 找出最高分
            let maxScore = Math.max(...Object.values(scores));
            let topStyles = Object.keys(scores).filter(style => scores[style] === maxScore);
            
            // 生成结果内容
            resultContent.innerHTML = '';
            
            // 标题部分
            const titleSection = document.createElement('div');
            titleSection.className = 'text-center mb-8';
            
            let mainStyle, secondaryStyle;
            let resultTitle, resultSubtitle, resultColor, resultIcon;
            
            if (topStyles.length === 1) {
                // 单一学习风格
                mainStyle = topStyles[0];
                const style = learningStyles[mainStyle];
                resultTitle = style.name;
                resultSubtitle = style.professionalName;
                resultColor = style.color;
                resultIcon = style.icon;
                
                titleSection.innerHTML = `
                    <div class="inline-block p-4 rounded-full" style="background-color: ${resultColor}20; color: ${resultColor}">
                        <i class="fa ${resultIcon} text-4xl"></i>
                    </div>
                    <h2 class="text-3xl font-bold mt-4" style="color: ${resultColor}">${resultTitle}</h2>
                    <p class="text-lg text-gray-600 mt-2">${resultSubtitle}</p>
                `;
            } else {
                // 混合学习风格
                mainStyle = topStyles[0];
                secondaryStyle = topStyles[1];
                const style1 = learningStyles[mainStyle];
                const style2 = learningStyles[secondaryStyle];
                
                titleSection.innerHTML = `
                    <div class="inline-block p-4 rounded-full bg-gradient-to-r ${style1.color}20 ${style2.color}20 text-primary">
                        <i class="fa fa-random text-4xl"></i>
                    </div>
                    <h2 class="text-3xl font-bold mt-4 text-primary">多元学习风格</h2>
                    <p class="text-lg text-gray-600 mt-2">${style1.name} + ${style2.name}</p>
                `;

            resultContent.appendChild(titleSection);
            
            // 分数统计
            const scoreSection = document.createElement('div');
            scoreSection.className = 'mb-8';
            scoreSection.innerHTML = `
                <h3 class="text-xl font-bold mb-4 text-center">你的学习风格分布</h3>

                    <div class="text-center p-4 rounded-xl" style="background-color: ${learningStyles.A.color}20; border: 2px solid ${learningStyles.A.color}30">
                        <div class="font-bold text-lg mb-2" style="color: ${learningStyles.A.color}">图像魔法师</div>
                        <div class="text-2xl font-bold" style="color: ${learningStyles.A.color}">${scores.A}</div>
                    </div>
                    <div class="text-center p-4 rounded-xl" style="background-color: ${learningStyles.B.color}20; border: 2px solid ${learningStyles.B.color}30">
                        <div class="font-bold text-lg mb-2" style="color: ${learningStyles.B.color}">声音探险家</div>
                        <div class="text-2xl font-bold" style="color: ${learningStyles.B.color}">${scores.B}</div>
                    </div>
                    <div class="text-center p-4 rounded-xl" style="background-color: ${learningStyles.C.color}20; border: 2px solid ${learningStyles.C.color}30">
                        <div class="font-bold text-lg mb-2" style="color: ${learningStyles.C.color}">能量实验家</div>
                        <div class="text-2xl font-bold" style="color: ${learningStyles.C.color}">${scores.C}</div>
                    </div>
                    <div class="text-center p-4 rounded-xl" style="background-color: ${learningStyles.D.color}20; border: 2px solid ${learningStyles.D.color}30">
                        <div class="font-bold text-lg mb-2" style="color: ${learningStyles.D.color}">逻辑破译者</div>
                        <div class="text-2xl font-bold" style="color: ${learningStyles.D.color}">${scores.D}</div>
                    </div>
                </div>
            `;
            resultContent.appendChild(scoreSection);
            
            // 总结部分
            const summarySection = document.createElement('div');
            summarySection.className = 'mb-8';
            
            if (topStyles.length === 1) {
                const style = learningStyles[mainStyle];
                summarySection.innerHTML = `
                    <div class="bg-white p-6 rounded-xl border-2" style="border-color: ${style.color}30">
                        <h3 class="text-xl font-bold mb-4" style="color: ${style.color}">一句话总结</h3>
                        <p class="text-lg text-gray-700">${style.summary}</p>
                    </div>
                `;
            } else {
                const style1 = learningStyles[mainStyle];
                const style2 = learningStyles[secondaryStyle];
                summarySection.innerHTML = `
                    <div class="bg-white p-6 rounded-xl border-2 border-primary/30">
                        <h3 class="text-xl font-bold mb-4 text-primary">一句话总结</h3>
                        <p class="text-lg text-gray-700">你同时拥有 ${style1.name} 和 ${style2.name} 的学习优势，可以灵活运用两种学习方式。</p>
                    </div>
                `;
            }
            
            resultContent.appendChild(summarySection);
            
            // 详细内容部分
            if (topStyles.length === 1) {
                const style = learningStyles[mainStyle];
                
                // 学习超能力
                const superpowerSection = document.createElement('div');
                superpowerSection.className = 'mb-8';
                superpowerSection.innerHTML = `
                    <div class="bg-gradient-to-r ${style.color}10 ${style.color}5 p-6 rounded-xl">
                        <h3 class="text-xl font-bold mb-4 flex items-center" style="color: ${style.color}">
                            <i class="fa fa-bolt mr-2"></i> 你的学习超能力
                        </h3>

                    </div>
                `;
                resultContent.appendChild(superpowerSection);
                
                // 为什么有些学习方式会让你累
                const challengesSection = document.createElement('div');

                challengesSection.innerHTML = `
                    <div class="bg-white p-6 rounded-xl border border-gray-200">
                        <h3 class="text-xl font-bold mb-4 text-gray-700">为什么有些学习方式会让你累</h3>

                    </div>
                `;
                resultContent.appendChild(challengesSection);
                
                // 你更适合这样学习
                const methodsSection = document.createElement('div');
                methodsSection.className = 'mb-8';
                methodsSection.innerHTML = `
                    <div class="bg-white p-6 rounded-xl border border-gray-200">

                            ${style.methods.map(method => `

                            ${style.notGoodAt.map(item => `
                                <li class="flex items-center text-gray-600">
                                    <i class="fa fa-times text-red-400 mr-2"></i> ${item}
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
                resultContent.appendChild(notGoodAtSection);
                
                // AI 可以怎么帮助你学习
                const aiHelpSection = document.createElement('div');
                aiHelpSection.className = 'mb-8';
                aiHelpSection.innerHTML = `
                    <div class="bg-gradient-to-r ${style.color}10 ${style.color}5 p-6 rounded-xl">
                        <h3 class="text-xl font-bold mb-4 flex items-center" style="color: ${style.color}">
                            <i class="fa fa-robot mr-2"></i> AI 可以怎么帮助你学习
                        </h3>
                        <ul class="space-y-2">
                            ${style.aiHelp.map(help => `
                                <li class="flex items-center text-gray-600">
                                    <i class="fa fa-magic text-purple-500 mr-2"></i> ${help}
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
                resultContent.appendChild(aiHelpSection);
                
                // 你是独特的小孩
                const closingSection = document.createElement('div');
                closingSection.className = 'mb-8';
                closingSection.innerHTML = `
                    <div class="bg-primary/10 p-6 rounded-xl text-center">
                        <h3 class="text-xl font-bold mb-4 text-primary">你是独特的小孩</h3>
                        <p class="text-gray-700 italic">${style.closingWords}</p>
                    </div>
                `;
                resultContent.appendChild(closingSection);
            } else {
                // 混合学习风格的详细内容
                const style1 = learningStyles[mainStyle];
                const style2 = learningStyles[secondaryStyle];
                
                // 学习超能力
                const superpowerSection = document.createElement('div');
                superpowerSection.className = 'mb-8';
                superpowerSection.innerHTML = `
                    <div class="bg-gradient-to-r from-primary/10 to-purple-100 p-6 rounded-xl">
                        <h3 class="text-xl font-bold mb-4 flex items-center text-primary">
                            <i class="fa fa-bolt mr-2"></i> 你的学习超能力
                        </h3>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div class="bg-white p-4 rounded-lg shadow-sm">
                                <h4 class="font-bold mb-2" style="color: ${style1.color}">${style1.name} 的优势</h4>
                                <p class="text-gray-600 text-sm">${style1.superpower.substring(0, 100)}...</p>
                            </div>
                            <div class="bg-white p-4 rounded-lg shadow-sm">
                                <h4 class="font-bold mb-2" style="color: ${style2.color}">${style2.name} 的优势</h4>
                                <p class="text-gray-600 text-sm">${style2.superpower.substring(0, 100)}...</p>
                            </div>
                        </div>
                    </div>
                `;
                resultContent.appendChild(superpowerSection);
                
                // 混合学习建议
                const mixedMethodsSection = document.createElement('div');
                mixedMethodsSection.className = 'mb-8';
                mixedMethodsSection.innerHTML = `
                    <div class="bg-white p-6 rounded-xl border border-gray-200">
                        <h3 class="text-xl font-bold mb-4 text-gray-700">混合学习建议</h3>
                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <h4 class="font-bold mb-3" style="color: ${style1.color}">${style1.name} 学习法</h4>
                                <ul class="space-y-2">
                                    ${style1.methods.slice(0, 3).map(method => `
                                        <li class="flex items-center text-gray-600">

                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                            <div>
                                <h4 class="font-bold mb-3" style="color: ${style2.color}">${style2.name} 学习法</h4>
                                <ul class="space-y-2">
                                    ${style2.methods.slice(0, 3).map(method => `
                                        <li class="flex items-center text-gray-600">
                                            <i class="fa fa-check text-green-500 mr-2"></i> ${method}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>
                        <div class="mt-6 p-4 bg-blue-50 rounded-lg">
                            <p class="text-blue-700"><i class="fa fa-lightbulb-o mr-2"></i> 建议：根据不同学科和内容，灵活切换两种学习方式，或者将它们结合起来使用。</p>
                        </div>
                    </div>
                `;
                resultContent.appendChild(mixedMethodsSection);
                
                // AI 可以怎么帮助你学习
                const aiHelpSection = document.createElement('div');
                aiHelpSection.className = 'mb-8';
                aiHelpSection.innerHTML = `
                    <div class="bg-gradient-to-r from-primary/10 to-purple-100 p-6 rounded-xl">
                        <h3 class="text-xl font-bold mb-4 flex items-center text-primary">
                            <i class="fa fa-robot mr-2"></i> AI 可以怎么帮助你学习
                        </h3>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div class="bg-white p-4 rounded-lg shadow-sm">
                                <h4 class="font-bold mb-2" style="color: ${style1.color}">${style1.name} 专属 AI 助手</h4>
                                <ul class="space-y-1">
                                    ${style1.aiHelp.slice(0, 3).map(help => `
                                        <li class="flex items-center text-gray-600 text-sm">
                                            <i class="fa fa-magic text-purple-500 mr-1"></i> ${help}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                            <div class="bg-white p-4 rounded-lg shadow-sm">
                                <h4 class="font-bold mb-2" style="color: ${style2.color}">${style2.name} 专属 AI 助手</h4>
                                <ul class="space-y-1">
                                    ${style2.aiHelp.slice(0, 3).map(help => `
                                        <li class="flex items-center text-gray-600 text-sm">
                                            <i class="fa fa-magic text-purple-500 mr-1"></i> ${help}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
                resultContent.appendChild(aiHelpSection);
                
                // 你是独特的小孩
                const closingSection = document.createElement('div');
                closingSection.className = 'mb-8';
                closingSection.innerHTML = `
                    <div class="bg-primary/10 p-6 rounded-xl text-center">
                        <h3 class="text-xl font-bold mb-4 text-primary">你是独特的小孩</h3>
                        <p class="text-gray-700 italic">拥有多种学习风格是一种优势！你可以根据不同的学习内容和场景，灵活选择最适合的学习方式。这种灵活性将帮助你在各种学习环境中都能取得好成绩。</p>
                    </div>
                `;
                resultContent.appendChild(closingSection);
            }
        }

        // 生成分享内容
        function generateShareContent() {
            // 统计分数
            const scores = { A: 0, B: 0, C: 0, D: 0 };
            for (const answer of Object.values(userAnswers)) {
                scores[answer]++;
            }
            
            // 找出最高分
            let maxScore = Math.max(...Object.values(scores));
            let topStyles = Object.keys(scores).filter(style => scores[style] === maxScore);
            
            let shareText = "【AI 学习风格测试结果】\n\n";
            
            if (topStyles.length === 1) {
                const style = learningStyles[topStyles[0]];
                shareText += `我的学习风格是：${style.name}（${style.professionalName}）\n\n`;
                shareText += `一句话总结：${style.summary}\n\n`;
                shareText += `我的学习超能力：${style.superpower.substring(0, 100)}...\n\n`;
                shareText += `我更适合这样学习：\n`;
                style.methods.slice(0, 3).forEach(method => {
                    shareText += `- ${method}\n`;
                });
            } else {
                const style1 = learningStyles[topStyles[0]];
                const style2 = learningStyles[topStyles[1]];
                shareText += `我的学习风格是：多元学习型（${style1.name} + ${style2.name}）\n\n`;
                shareText += `我同时拥有两种学习优势，可以灵活运用不同的学习方式。\n\n`;
                shareText += `适合我的学习方法：\n`;
                shareText += `- ${style1.methods[0]}\n`;
                shareText += `- ${style1.methods[1]}\n`;
                shareText += `- ${style2.methods[0]}\n`;
                shareText += `- ${style2.methods[1]}\n`;
            }
            
            shareText += `\n测试链接：https://ai-learning-style-test.example.com`;
            
            shareContent.innerHTML = `<pre class="text-left whitespace-pre-wrap">${shareText}</pre>`;
        }
    </script>
